
name: Three-Tier CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 992382771174.dkr.ecr.ap-south-1.amazonaws.com
  SOURCE_REPO: jake-adams-wwt/example-three-tier-application

jobs:
  ci:
    name: Test, Build, Scan and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: application
          # If the source repository is private, create a read-only
          # SOURCE_REPO_TOKEN secret and uncomment this line:
          # token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Validate Dockerfiles
        run: |
          set -e
          for dir in src/web src/api src/db; do
            test -f "application/$dir/Dockerfile" || {
              echo "::error::Missing Dockerfile: $dir"
              exit 1
            }
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and run available tests
        working-directory: application
        shell: bash
        run: |
          set -e

          for dir in src/api src/web; do
            if [ ! -f "$dir/package.json" ]; then
              echo "No package.json in $dir; skipping."
              continue
            fi

            if [ ! -f "$dir/package-lock.json" ]; then
              echo "No package-lock.json in $dir; skipping npm tests."
              continue
            fi

            (cd "$dir" && npm ci)

            TEST_SCRIPT=$(node -p "require('./$dir/package.json').scripts?.test || ''")

            if [ -z "$TEST_SCRIPT" ]; then
              echo "No test script in $dir; skipping."
            elif [[ "$TEST_SCRIPT" == *"no test specified"* ]]; then
              echo "Placeholder test script in $dir; skipping."
            else
              (cd "$dir" && npm test)
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web image
        run: |
          docker build -t three-tier-web:$GITHUB_SHA application/src/web

      - name: Build API image
        run: |
          docker build -t three-tier-api:$GITHUB_SHA application/src/api

      - name: Build DB migration image
        run: |
          docker build -t three-tier-db:$GITHUB_SHA application/src/db

      - name: Scan Web image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: three-tier-web:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: three-tier-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan DB migration image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: three-tier-db:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Configure AWS credentials using OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ThreeTierCI

      - name: Verify AWS identity
        if: github.event_name != 'pull_request'
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag images with commit SHA
        if: github.event_name != 'pull_request'
        run: |
          for image in three-tier-web three-tier-api three-tier-db; do
            docker tag "$image:$GITHUB_SHA" "$ECR_REGISTRY/$image:$GITHUB_SHA"
          done

      - name: Push images to ECR
        if: github.event_name != 'pull_request'
        run: |
          for image in three-tier-web three-tier-api three-tier-db; do
            docker push "$ECR_REGISTRY/$image:$GITHUB_SHA"
          done
