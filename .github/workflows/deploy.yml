
name: Three-Tier CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and Scan Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI Repository
        uses: actions/checkout@v4

      - name: Checkout Application Source
        uses: actions/checkout@v4
        with:
          repository: jake-adams-wwt/example-three-tier-application
          path: application
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}

      - name: Verify Dockerfiles
        shell: bash
        run: |
          set -e
          for service in web api db; do
            if [ ! -f "application/src/${service}/Dockerfile" ]; then
              echo "Missing Dockerfile: application/src/${service}/Dockerfile"
              exit 1
            fi
          done

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and Test API
        working-directory: application/src/api
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

          if [ -f package.json ]; then
            TEST_SCRIPT=$(node -p "require('./package.json').scripts?.test || ''")
            if [ -n "$TEST_SCRIPT" ] && \
               ! echo "$TEST_SCRIPT" | grep -qi "no test specified"; then
              npm test
            else
              echo "No real API test script configured; skipping tests."
            fi
          fi

      - name: Install and Test Web
        working-directory: application/src/web
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

          if [ -f package.json ]; then
            TEST_SCRIPT=$(node -p "require('./package.json').scripts?.test || ''")
            if [ -n "$TEST_SCRIPT" ] && \
               ! echo "$TEST_SCRIPT" | grep -qi "no test specified"; then
              npm test
            else
              echo "No real Web test script configured; skipping tests."
            fi
          fi

      - name: Build Web Image
        run: docker build -t three-tier-web:${GITHUB_SHA} application/src/web

      - name: Build API Image
        run: docker build -t three-tier-api:${GITHUB_SHA} application/src/api

      - name: Build Database Migration Image
        run: docker build -t three-tier-db:${GITHUB_SHA} application/src/db

      - name: Scan Web Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: three-tier-web:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan API Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: three-tier-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Scan Database Migration Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: three-tier-db:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Configure AWS Credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS Identity
        if: github.event_name != 'pull_request'
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Images to ECR
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCOUNT_ID: "992382771174"
          AWS_REGION: ap-south-1
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -e

          for service in web api db; do
            LOCAL_IMAGE="three-tier-${service}:${IMAGE_TAG}"
            ECR_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/three-tier-${service}:${IMAGE_TAG}"

            docker tag "${LOCAL_IMAGE}" "${ECR_IMAGE}"
            docker push "${ECR_IMAGE}"

            echo "Pushed: ${ECR_IMAGE}"
          done

