on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 992382771174.dkr.ecr.ap-south-1.amazonaws.com
  SOURCE_REPO: jake-adams-wwt/example-three-tier-application

jobs:
  ci:
    name: Test, Build, Scan and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: application

      - name: Validate Docker build contexts
        run: |
          set -e
          for dir in src/web src/api src/db; do
            test -f "application/$dir/Dockerfile" || {
              echo "::error::Missing Dockerfile: $dir"
              exit 1
            }
          done
          echo "All Dockerfiles found."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run available application tests
        working-directory: application
        run: |
          set -e
          for dir in src/api src/web; do
            if [ -f "$dir/package-lock.json" ]; then
              echo "Installing dependencies in $dir"
              (cd "$dir" && npm ci)
              echo "Running tests in $dir"
              (cd "$dir" && npm test --if-present)
            else
              echo "No package-lock.json in $dir; skipping npm tests."
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web image
        run: |
          docker build \
            -t three-tier-web:$GITHUB_SHA \
            application/src/web

      - name: Build API image
        run: |
          docker build \
            -t three-tier-api:$GITHUB_SHA \
            application/src/api

      - name: Build DB migration image
        run: |
          docker build \
            -t three-tier-db:$GITHUB_SHA \
            application/src/db

      - name: Scan Web image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: three-tier-web:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan API image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: three-tier-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan DB migration image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: three-tier-db:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Configure AWS credentials using OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ThreeTierCI

      - name: Verify AWS identity
        if: github.event_name != 'pull_request'
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag images with full commit SHA
        if: github.event_name != 'pull_request'
        run: |
          docker tag three-tier-web:$GITHUB_SHA \
            "$ECR_REGISTRY/three-tier-web:$GITHUB_SHA"

          docker tag three-tier-api:$GITHUB_SHA \
            "$ECR_REGISTRY/three-tier-api:$GITHUB_SHA"

          docker tag three-tier-db:$GITHUB_SHA \
            "$ECR_REGISTRY/three-tier-db:$GITHUB_SHA"

      - name: Push Web image to ECR
        if: github.event_name != 'pull_request'
        run: |
          docker push "$ECR_REGISTRY/three-tier-web:$GITHUB_SHA"

      - name: Push API image to ECR
        if: github.event_name != 'pull_request'
        run: |
          docker push "$ECR_REGISTRY/three-tier-api:$GITHUB_SHA"

      - name: Push DB migration image to ECR
        if: github.event_name != 'pull_request'
        run: |
          docker push "$ECR_REGISTRY/three-tier-db:$GITHUB_SHA"

